function fmt(n){return n==null?'-':Number(n).toLocaleString('zh-CN',{maximumFractionDigits:2})}
function cls(n){return n>0?'up':(n<0?'down':'')}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function maskUser(u){return u?u.slice(0,3)+'***':'-'}
function riskClass(r){r=r||0;return r>90?'r':(r>70?'a':'g')}
function riskDot(r){return '<span class="dot '+riskClass(r)+'"></span>'}
function currentSegLabel(){
  const hm=new Date().getHours()*60+new Date().getMinutes();
  if(hm>=21*60||hm<150) return '夜盘交易中';
  if(hm>=9*60&&hm<15*60) return '日盘交易中';
  if(hm>=15*60&&hm<21*60) return '日盘已收盘';
  return '休市';
}
function renderTabs(){
  document.getElementById('tabs').innerHTML='<div class="tab'+(cur==='overview'?' on':'')+'" onclick="setCur(\'overview\')">总览</div>'+ORDER.map(c=>'<div class="tab'+(cur===c?' on':'')+'" onclick="setCur(\''+c+'\')">'+NAMES[c]+'</div>').join('')+'<div class="tab'+(cur==='settlement'?' on':'')+'" onclick="setCur(\'settlement\')">结算单</div>';
}
function renderSegs(){
  const now=new Date();
  const hm=now.getHours()*60+now.getMinutes();
  let active='';
  if(hm>=21*60||hm<150) active='night';
  else if(hm>=9*60&&hm<9*60+30) active='day';
  else if(hm>=9*60+30&&hm<10*60) active='index';
  const map=[['night','21:00 夜盘'],['day','09:00 日盘'],['index','09:30 股指']];
  document.getElementById('segs').innerHTML=map.map(x=>'<span class="seg'+(active===x[0]?' on':'')+'">'+x[1]+'</span>').join('')+'<span style="color:var(--dim);margin-left:10px">'+now.toLocaleTimeString('zh-CN')+'</span>';
}

function posTable(positions){
  const arr=(positions||[]).slice();
  if(window._posSortKey){
    arr.sort((a,b)=>{
      const va=a[window._posSortKey], vb=b[window._posSortKey];
      const na=(va===null||va===undefined), nb=(vb===null||vb===undefined);
      if(na&&nb) return 0;
      if(na) return 1;
      if(nb) return -1;
      if(typeof va==='string') return window._posSortDir>0 ? va.localeCompare(vb) : vb.localeCompare(va);
      return window._posSortDir>0 ? va-vb : vb-va;
    });
  }
  const icon=(k)=>window._posSortKey===k ? (window._posSortDir>0?' ▲':' ▼') : '';
  const th=(k,label)=>'<th style="cursor:pointer;user-select:none" onclick="posSort(\''+k+'\')">'+label+icon(k)+'</th>';
  return '<table><thead><tr>'+
th('symbol','合约')+th('long','多单')+th('short','空单')+th('open_long','多均价')+th('open_short','空均价')+th('last','最新价')+th('profit','浮动盈亏')+th('margin','保证金')+
'</tr></thead><tbody>'+
arr.map(p=>'<tr><td>'+esc(p.symbol)+'</td><td>'+p.long+'</td><td>'+p.short+'</td><td>'+fmt(p.open_long)+'</td><td>'+fmt(p.open_short)+'</td><td>'+fmt(p.last)+'</td><td class="'+cls(p.profit)+'">'+fmt(p.profit)+'</td><td>'+fmt(p.margin)+'</td></tr>').join('')+
'</tbody></table>';
}
function posSort(k){
  if(window._posSortKey===k) window._posSortDir=-window._posSortDir;
  else { window._posSortKey=k; window._posSortDir=-1; }
  tick();
}
function tradeTable(trades){
  return '<table><thead><tr>'+

(trades||[]).slice().reverse().map(t=>{
  let d=t.direction==='BUY'?'<span class="buy">BUY</span>':(t.direction==='SELL'?'<span class="sell">SELL</span>':esc(t.direction));
  return '<tr><td>'+t.time+'</td><td>'+esc(t.symbol)+'</td><td>'+d+'</td><td>'+t.offset+'</td><td>'+t.volume+'</td><td>'+fmt(t.price)+'</td><td>'+fmt(t.commission)+'</td></tr>';
}).join('')+
'</tbody></table>';
}

let setlCombo=ORDER[0], setlDate='', setlList=[], setlData=null;
async function loadSettlementList(){
  try{
    const res=await fetch('/api/settlement?combo='+setlCombo,{cache:'no-store'});
    if(!res.ok) return;
    const j=await res.json();
    setlList=(j.settlements||[]);
    if(!setlDate||!setlList.some(x=>x.settle_date===setlDate)) setlDate=setlList.length?setlList[0].settle_date:'';
  }catch(e){}
}
async function loadSettlementDetail(){
  if(!setlDate){setlData=null;return;}

    const res=await fetch('/api/settlement?combo='+setlCombo+'&date='+setlDate,{cache:'no-store'});
    if(res.ok) setlData=await res.json(); else setlData=null;
  }catch(e){setlData=null;}
}

  const s=setlData;let rows=[['衡合FOF结算单',NAMES[setlCombo],s.settle_date],['上日权益',s.open_balance],['当日手续费',s.day_commission],['当日平仓盈亏',s.day_close_profit],['持仓盈亏',s.position_profit],['当日客户权益',s.balance],['保证金占用',s.margin],['可用资金',s.available],['风险度%',s.risk_ratio],[]];
  rows.push(['===持仓明细===']);rows.push(['合约','多单','空单','多均价','空均价','最新价','浮动盈亏','保证金']);
  s.positions.forEach(p=>rows.push([p.symbol,p.long,p.short,p.open_long,p.open_short,p.last,p.profit,p.margin]));
  rows.push([]);rows.push(['===成交记录===']);rows.push(['时间','合约','方向','开平','手数','价格','手续费']);
  s.trades.forEach(t=>rows.push([t.tstr,t.symbol,t.direction,t.offset,t.volume,t.price,t.commission]));
  rows.push([]);rows.push(['===平仓明细===']);rows.push(['合约','方向','手数','开仓均价','平仓价','平仓盈亏']);
  s.close_trades.forEach(x=>rows.push([x.symbol,x.direction,x.volume,x.open_price,x.close_price,x.profit]));
  const csv=rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='settlement_'+setlCombo+'_'+s.settle_date+'.csv';a.click();
}

let lastErr='';
async function tick(){
  try{
    const r=await fetch('/api/state?_='+Date.now(),{cache:'no-store'});
    if(r.ok){
      const j=await r.json();
      if(j && Object.keys(j).length>0){ S=j; lastErr=''; }
      else { lastErr=''; }
    } else {
      lastErr='';
    }
  }catch(e){ lastErr=''; }
  let n=0;for(const c of ORDER){if(S[c]&&S[c].running)n++;}

}
