*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:"Microsoft YaHei",Consolas,monospace;font-size:13px}
.topbar{background:var(--orange);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.topbar h1{font-size:16px;font-weight:500}
.topbar .stat{font-size:13px;display:flex;align-items:center;gap:6px}
.subbar{background:var(--panel);border-bottom:0.5px solid var(--border);padding:8px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}

.tab{padding:6px 12px;background:var(--bg);border:0.5px solid var(--border);color:var(--dim);cursor:pointer;font-size:12px;border-radius:6px}
.tab:hover{color:var(--fg)}
.tab.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.segs{display:flex;gap:6px;align-items:center;font-size:12px}
.seg{padding:3px 8px;border-radius:6px;border:0.5px solid var(--border);color:var(--dim)}
.seg.on{background:#E6F1FB;color:var(--blue);border-color:#B5D4F4}
.wrap{padding:16px}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:12px}
.card{background:var(--panel);border:0.5px solid var(--border);border-radius:8px;padding:12px}
.card .k{color:var(--dim);font-size:12px}
.card .v{font-size:22px;font-weight:500;margin-top:6px;font-variant-numeric:tabular-nums}
.cards6{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:12px}
.up{color:var(--red)}.down{color:var(--green)}
table{width:100%;border-collapse:collapse;background:var(--panel);border:0.5px solid var(--border);border-radius:8px;overflow:hidden}
th,td{padding:7px 10px;text-align:right;border-bottom:0.5px solid #F1EFE8;white-space:nowrap;font-size:12px}
th{color:var(--dim);font-weight:400;background:#FAFBFC;position:sticky;top:0}
td:first-child,th:first-child{text-align:left}
tr:hover td{background:#F2F6FB}
.grid3{display:grid;grid-template-columns:1.05fr 1.45fr 1fr;gap:12px;align-items:start}
.panel{background:var(--panel);border:0.5px solid var(--border);border-radius:8px;padding:12px}
.panel .ttl{font-size:14px;font-weight:500;margin-bottom:10px}
.log{background:var(--panel);border:0.5px solid var(--border);border-radius:8px;padding:10px;margin-top:12px;height:150px;overflow-y:auto;color:var(--dim);font-size:11px;line-height:1.6}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:12px}
.ov-cell{background:var(--panel);border:0.5px solid var(--border);border-radius:8px;padding:10px;cursor:pointer}
.ov-cell:hover{border-color:var(--orange)}
.ov-cell .nm{font-size:13px;margin-bottom:6px;font-weight:500}
.ov-cell .row{display:flex;justify-content:space-between;margin:3px 0;font-size:12px}
.ov-cell .lbl{color:var(--dim)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.g{background:var(--green)}.dot.a{background:#BA7517}.dot.r{background:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:11px;background:var(--bg);color:var(--fg);padding:3px 7px;border-radius:5px;border:0.5px solid var(--border);cursor:pointer}
.chip.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.buy{background:#FCEBEB;color:var(--red);padding:1px 6px;border-radius:4px;font-size:11px}
.sell{background:#EAF3DE;color:var(--green);padding:1px 6px;border-radius:4px;font-size:11px}
.btn{background:var(--orange);color:#fff;border:none;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px}
.btn:hover{opacity:0.9}
.rangectl{display:flex;gap:6px;margin-top:8px}
.rbtn{font-size:11px;padding:2px 8px;border:0.5px solid var(--border);border-radius:5px;background:var(--bg);color:var(--dim);cursor:pointer}
.rbtn.on{background:var(--orange);color:#fff;border-color:var(--orange)}

  if(!rd) return;
  const d=READINESS_SNAP;
  if(!d||d.ready==null){ rd.innerHTML='<span class="r-note">今日尚未运行数据就绪检查（每日 19:30 首查 / 20:15 终查）</span>'; return; }

function posTable(positions){
  const arr=(positions||[]).slice();
  if(window._posSortKey){
    arr.sort((a,b)=>{
      const va=a[window._posSortKey], vb=b[window._posSortKey];
      const na=(va===null||va===undefined), nb=(vb===null||vb===undefined);
      if(na&&nb) return 0;
      if(na) return 1;
      if(nb) return -1;
      if(typeof va==='string') return window._posSortDir>0 ? va.localeCompare(vb) : vb.localeCompare(va);
      return window._posSortDir>0 ? va-vb : vb-va;
    });
  }
  const icon=(k)=>window._posSortKey===k ? (window._posSortDir>0?' ▲':' ▼') : '';
  const th=(k,label)=>'<th style="cursor:pointer;user-select:none" onclick="posSort(\''+k+'\')">'+label+icon(k)+'</th>';
  return '<table><thead><tr>'+
th('symbol','合约')+th('long','多单')+th('short','空单')+th('open_long','多均价')+th('open_short','空均价')+th('last','最新价')+th('profit','浮动盈亏')+th('margin','保证金')+
'</tr></thead><tbody>'+
arr.map(p=>'<tr><td>'+esc(p.symbol)+'</td><td>'+p.long+'</td><td>'+p.short+'</td><td>'+fmt(p.open_long)+'</td><td>'+fmt(p.open_short)+'</td><td>'+fmt(p.last)+'</td><td class="'+cls(p.profit)+'">'+fmt(p.profit)+'</td><td>'+fmt(p.margin)+'</td></tr>').join('')+
'</tbody></table>';
}
function posSort(k){
  if(window._posSortKey===k) window._posSortDir=-window._posSortDir;

}

let lastErr='';
async function tick(){
  try{
    const r=await fetch('/api/state?_='+Date.now(),{cache:'no-store'});
    if(r.ok){
      const j=await r.json();
      if(j && Object.keys(j).length>0){ S=j; lastErr=''; }
      else { lastErr=''; }
    } else {
      lastErr='';
    }
  }catch(e){ lastErr=''; }
  let n=0;for(const c of ORDER){if(S[c]&&S[c].running)n++;}
  document.getElementById('conn').innerHTML='<span class="dot g" style="background:#fff"></span>监控中 · '+n+'/'+ORDER.length+' 组合已连接'+(lastErr?' <span style="color:#ff6b6b">'+esc(lastErr)+'</span>':'');
  renderSegs();
  if(cur==='overview') renderOverview(S);
  else if(cur==='settlement') renderSettlement();
  else renderDetail(S,cur);
}
