*{box-sizing:border-box;margin:0;padding:0}

@keyframes blink{50%{opacity:.3}}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-bottom:12px}
.ov-cell{background:var(--panel);border:1px solid var(--border);padding:10px;cursor:pointer}
.ov-cell .nm{color:var(--blue);font-size:12px;margin-bottom:6px}
.ov-cell .row{display:flex;justify-content:space-between;margin:3px 0;font-size:12px}
.ov-cell .lbl{color:var(--dim)}

let S=SNAPSHOT, cur='overview';
function fmt(n){return n==null?'-':Number(n).toLocaleString('zh-CN',{maximumFractionDigits:2})}
function cls(n){return n>0?'up':(n<0?'down':'')}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function renderTabs(){
  const names={seven_composite:'七重复合',style_strategy:'风格策略',sector_diversified:'板块分散',pure_profit:'纯利润',scheme_growth:'进取成长',scheme_balanced:'策略均衡',risk_balanced:'风险均衡',scheme_steady:'稳健磐石',scheme_neutral:'多空中性',long_short:'多空对冲'};
  document.getElementById('tabs').innerHTML='<div class="tab'+(cur==='overview'?' on':'')+'" onclick="setCur(\'overview\')">总览</div>'+ORDER.map(c=>`<div class="tab${cur===c?' on':''}" onclick="setCur('${c}')">${names[c]||c}</div>`).join('');
}
function setCur(c){cur=c;renderTabs();tick();}
function accountCards(a){
  const p=a.position_profit||0,f=a.float_profit||0;
  return `<div class="cards">
    <div class="card"><div class="k">动态权益</div><div class="v">${fmt(a.balance)}</div></div>
    <div class="card"><div class="k">可用资金</div><div class="v">${fmt(a.available)}</div></div>
    <div class="card"><div class="k">占用保证金</div><div class="v">${fmt(a.margin)}</div></div>
    <div class="card"><div class="k">持仓盈亏</div><div class="v ${cls(p)}">${fmt(p)}</div></div>
    <div class="card"><div class="k">浮动盈亏</div><div class="v ${cls(f)}">${fmt(f)}</div></div>
    <div class="card"><div class="k">风险度</div><div class="v">${fmt(a.risk_ratio)}%</div></div></div>`;
}
function posTable(positions){
  return `<div class="sec">持仓明细（${positions.length}）</div><div style="overflow:auto;max-height:40vh"><table><thead><tr>
<th>合约</th><th>多单</th><th>空单</th><th>多均价</th><th>空均价</th><th>最新价</th><th>浮动盈亏</th><th>保证金</th></tr></thead><tbody>
${(positions||[]).map(p=>`<tr><td>${esc(p.symbol)}</td><td>${p.long||''}</td><td>${p.short||''}</td><td>${p.open_long||''}</td><td>${p.open_short||''}</td><td>${fmt(p.last)}</td><td class="${cls(p.profit)}">${fmt(p.profit)}</td><td>${fmt(p.margin)}</td></tr>`).join('')}
</tbody></table></div>`;
}
function tradeTable(trades){
  return `<div class="sec">成交记录（最近30笔）</div><div style="overflow:auto;max-height:20vh"><table><thead><tr>
<th>时间</th><th>合约</th><th>方向</th><th>开平</th><th>手数</th><th>价格</th><th>手续费</th></tr></thead><tbody>
${(trades||[]).slice().reverse().map(t=>`<tr><td>${t.time||''}</td><td>${esc(t.symbol)}</td><td>${t.direction}</td><td>${t.offset}</td><td>${t.volume}</td><td>${fmt(t.price)}</td><td>${fmt(t.commission)}</td></tr>`).join('')}
</tbody></table></div>`;
}
function logBox(st){const logs=(st.logs||[]).slice().reverse();return `<div class="log">${logs.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`;}
function renderOverview(S){
  let sumBal=0,sumMargin=0,sumPnl=0,sumRisk=0,cnt=0,cells='';
  for(const c of ORDER){
    const st=S[c]; if(!st) continue;
    const a=st.account||{}; const b=a.balance||0,m=a.margin||0,p=a.position_profit||0;
    sumBal+=b;sumMargin+=m;sumPnl+=p;sumRisk+=(a.risk_ratio||0);cnt++;
    cells+=`<div class="ov-cell" onclick="setCur('${c}')"><div class="nm">${st.name} <span style="color:var(--dim);font-size:10px">${st.mode}</span></div>
      <div class="row"><span class="lbl">权益</span><span>${fmt(b)}</span></div>
      <div class="row"><span class="lbl">保证金</span><span>${fmt(m)}</span></div>
      <div class="row"><span class="lbl">盈亏</span><span class="${cls(p)}">${fmt(p)}</span></div>
      <div class="row"><span class="lbl">风险度</span><span>${fmt(a.risk_ratio)}%</span></div>
      <div class="row"><span class="lbl">持仓/目标</span><span>${(st.positions||[]).length}/${st.meta.target_count||0}</span></div></div>`;
  }
  document.getElementById('view').innerHTML=`
    <div class="cards">
      <div class="card"><div class="k">10账户总权益</div><div class="v">${fmt(sumBal)}</div></div>
      <div class="card"><div class="k">总保证金</div><div class="v">${fmt(sumMargin)}</div></div>
      <div class="card"><div class="k">总持仓盈亏</div><div class="v ${cls(sumPnl)}">${fmt(sumPnl)}</div></div>
      <div class="card"><div class="k">平均风险度</div><div class="v">${fmt(cnt?sumRisk/cnt:0)}%</div></div></div>
    <div class="ov-grid">${cells}</div>
    <div style="color:var(--dim);font-size:11px">点击任意组合卡片查看明细 · 午休时段(11:30-13:30)挂单等开盘成交</div>`;
}
function renderDetail(S,c){
  const st=S[c]; if(!st){document.getElementById('view').innerHTML='<div class="log">无数据</div>';return;}
  const a=st.account||{},m=st.meta||{};
  document.getElementById('view').innerHTML=`
    <div style="color:var(--dim);font-size:12px;margin-bottom:8px">${st.name} · ${st.mode} · 权益${fmt(m.equity)} · 目标${m.target_count||0}${m.scale!==undefined?' · scale='+Number(m.scale).toFixed(4):''}${m.trader_count?' · 盘手'+m.trader_count+'人':''} · 更新${new Date((st.updated||0)*1000).toLocaleTimeString()}</div>
    ${accountCards(a)}${posTable(st.positions)}${tradeTable(st.trades)}${logBox(st)}`;
}
function tick(){
  if(cur==='overview') renderOverview(S); else renderDetail(S,cur);
}
async function refresh(){
  try{const r=await fetch('http://127.0.0.1:18081/api/state',{cache:'no-store'});if(r.ok){S=await r.json();}}catch(e){}
  tick();
}
renderTabs();tick();setInterval(refresh,2000);
</script></body></html>
