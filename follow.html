function fmt(n){return n==null?'-':Number(n).toLocaleString('zh-CN',{maximumFractionDigits:2})}
function cls(n){return n>0?'up':(n<0?'down':'')}
function render(s){
  const m=s.meta||{},a=s.account||{};
  document.getElementById('meta').textContent=`${m.combo||''} · 权益${fmt(m.equity)} · 目标${m.target_count||0}品种 · scale=${(m.scale||0).toFixed(5)} · 更新${new Date(s.updated*1000).toLocaleTimeString()}`;
  const p=a.position_profit||0,f=a.float_profit||0;
  document.getElementById('cards').innerHTML=`
    <div class="card"><div class="k">动态权益</div><div class="v">${fmt(a.balance)}</div></div>
    <div class="card"><div class="k">可用资金</div><div class="v">${fmt(a.available)}</div></div>
    <div class="card"><div class="k">占用保证金</div><div class="v">${fmt(a.margin)}</div></div>
    <div class="card"><div class="k">持仓盈亏</div><div class="v ${cls(p)}">${fmt(p)}</div></div>
    <div class="card"><div class="k">浮动盈亏</div><div class="v ${cls(f)}">${fmt(f)}</div></div>
    <div class="card"><div class="k">风险度</div><div class="v">${fmt(a.risk_ratio)}%</div></div>`;
  document.getElementById('pos').innerHTML=(s.positions||[]).map(p=>`
    <tr><td>${p.symbol}</td><td>${p.long||''}</td><td>${p.short||''}</td>
    <td>${p.open_long||''}</td><td>${p.open_short||''}</td><td>${fmt(p.last)}</td>
    <td class="${cls(p.profit)}">${fmt(p.profit)}</td><td>${fmt(p.margin)}</td></tr>`).join('');
  document.getElementById('trades').innerHTML=(s.trades||[]).slice().reverse().map(t=>`
    <tr><td>${t.time||''}</td><td>${t.symbol}</td><td>${t.direction}</td><td>${t.offset}</td><td>${t.volume}</td><td>${fmt(t.price)}</td></tr>`).join('');
  const logs=(s.logs||[]).slice().reverse();
  document.getElementById('log').innerHTML=logs.map(x=>`<div>${x}</div>`).join('');
}
render(SNAPSHOT);
async function tick(){
  try{
    const r=await fetch('http://127.0.0.1:18081/api/state',{cache:'no-store'});
    if(r.ok){const s=await r.json();render(s);}
  }catch(e){}
}
setInterval(tick,2000);
