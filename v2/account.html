<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账户分析 · 衡合FOF</title>
<style>
:root{
  --up:#cf222e; --down:#1a7f37; --blue:#0969da; --gold:#ba7517;
  --text:#1f2328; --sub:#57606a; --weak:#8b949e;
  --page:#f6f8fa; --card:#ffffff; --line:#d0d7de; --nav:#1f2a44;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--page);color:var(--text);font-size:14px}
.topnav{background:var(--nav);color:#fff;padding:0 20px;height:52px;display:flex;align-items:center;gap:24px}
.topnav .brand{font-weight:700;font-size:16px;letter-spacing:1px}
.topnav .navlink{color:#c9d4e8;text-decoration:none;font-size:13px;padding:4px 10px;border-radius:6px}
.topnav .navlink.active{background:#2d4a7c;color:#fff}
.topnav .navlink:hover{color:#fff}
.topnav .spacer{flex:1}
.topnav .sel{background:#2d4a7c;color:#fff;border:1px solid #44639a;border-radius:6px;padding:5px 10px;font-size:13px;outline:none}
.wrap{max-width:1280px;margin:0 auto;padding:16px 20px 40px}
.info-bar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.info-bar h1{font-size:20px;font-weight:700}
.info-bar .tag{background:#f0f4fa;border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--sub)}
.info-bar .tag.mode{background:#fff6e5;border-color:#f0c674;color:var(--gold)}
.info-bar .tag.up{background:#fde8e8;border-color:#f3b8b8;color:var(--up)}
.info-bar .right{margin-left:auto;font-size:12px;color:var(--sub);text-align:right}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:8px 18px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--sub);border:none;background:transparent}
.tab:hover{background:#f0f4fa;color:var(--text)}
.tab.active{background:var(--nav);color:#fff;font-weight:600}
.subtabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.subtab{padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--sub);background:var(--card);border:1px solid var(--line)}
.subtab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
/* 持仓分析单页版面（2026-08-27 重做） */
.grid-3{display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:12px}
@media(max-width:1080px){.grid-3{grid-template-columns:1fr}}
.pos-table-wrap,.trade-table-wrap{max-height:380px;overflow-y:auto;border:1px solid #eef1f5;border-radius:8px}
.pos-table-wrap th{position:sticky;top:0;z-index:1}
.chips-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip-btn{padding:6px 14px;background:var(--card);border:1px solid var(--line);border-radius:18px;cursor:pointer;font-size:13px;color:var(--text);transition:all .15s}
.chip-btn:hover{border-color:var(--blue);color:var(--blue)}
.chip-btn.on{background:#fff7e6;border-color:#f0c674;color:#a06000;font-weight:600}
.details-toggle{font-size:12px;color:var(--blue);cursor:pointer;margin-top:8px;user-select:none}
.details-area{margin-top:8px;padding-top:8px;border-top:1px dashed #eaeef2;display:none}
.details-area.open{display:block}
.card .label{font-size:12px;color:var(--weak);margin-bottom:4px}
.card .value{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.card .sub{font-size:11px;color:var(--weak);margin-top:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.panel h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel h3 .hint{font-size:11px;color:var(--weak);font-weight:400}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}
.kv .row{display:flex;justify-content:space-between;border-bottom:1px dashed #eaeef2;padding:5px 0;font-size:13px}
.kv .row .k{color:var(--sub)}
.kv .row .v{font-weight:600;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f6f8fa;color:var(--sub);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid #eef1f5;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tr:hover td{background:#fafbfc}
.up{color:var(--up)} .down{color:var(--down)}
.muted{color:var(--weak)}
.bar-bg{background:#eef1f5;border-radius:4px;height:8px;overflow:hidden;min-width:60px}
.bar-fill{height:100%;border-radius:4px}
.mini-legend{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-top:8px;flex-wrap:wrap}
.member-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.member-card .nm{font-weight:600;font-size:14px}
.member-card .tg{font-size:11px;color:var(--blue);margin-top:3px}
.member-card .kv2{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:6px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:13px;color:var(--sub)}
.pager button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 12px;cursor:pointer}
.pager button:hover{background:#f0f4fa}
.pager button:disabled{opacity:.4;cursor:default}
.filterbar{display:flex;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap;font-size:13px}
.filterbar select,.filterbar input{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px;background:#fff}
.empty{padding:40px;text-align:center;color:var(--weak);font-size:13px}
.feature-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px}
.feature-row .fk{width:70px;color:var(--sub);flex-shrink:0}
.feature-row .fv{width:52px;text-align:right;font-weight:600;flex-shrink:0}
.footer{text-align:center;color:var(--weak);font-size:12px;padding:20px 0}
svg{display:block;width:100%;height:auto}
/* 实时监控整合（2026-08-27） */
.ready-bar{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin-bottom:14px;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ready-bar .ok{color:var(--down);font-weight:600}
.ready-bar .bad{color:var(--up);font-weight:600}
.ready-bar .muted-note{color:var(--weak);font-size:12px}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.ov-cell{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.ov-cell:hover{border-color:var(--blue)}
.ov-cell.on{border-color:var(--blue);background:#f0f7ff}
.ov-cell .nm{font-size:13px;font-weight:600;margin-bottom:6px}
.ov-cell .row{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin:3px 0}
.seg-light{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.log-box{background:#1f2a44;color:#c9d4e8;border-radius:10px;padding:10px 12px;font-size:11px;font-family:Consolas,monospace;height:160px;overflow-y:auto;line-height:1.7;margin-top:10px}
.live-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.live-status{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="topnav">
  <span class="brand">衡合FOF</span>
  <a class="navlink" href="index.html">🏠 首页</a>
  <a class="navlink active" href="account.html">📈 账户分析</a>
  <a class="navlink" href="analysis.html">🔬 数据分析</a>
  <a class="navlink" href="settings.html">⚙️ 系统设置</a>
  <a class="navlink" href="intro.html">📖 系统简介</a>
<div class="spacer"></div>  <select id="comboSel" class="sel"></select>

</div>  <select id="comboSel" class="sel"></select>
</div>

<div class="wrap">
  <div class="info-bar" id="infoBar"></div>
  <div class="tabs" id="mainTabs">
    <button class="tab active" data-tab="overview">总览</button>
    <button class="tab" data-tab="profile">账户概况</button>
    <button class="tab" data-tab="profit">盈利分析</button>
    <button class="tab" data-tab="variety">品种分析</button>
    <button class="tab" data-tab="risk">风控能力</button>
    <button class="tab" data-tab="positions">持仓分析</button>
  </div>
  <div id="mainContent"></div>
  <div class="footer">数据来源：衡合FOF跟投系统 · 模拟账户数据与本组合独立采集 · 仅供内部参考，不构成投资建议</div>
</div>

<script src="../portfolio_data.js"></script>
<script src="../account_analysis.js"></script>
<script>
const AA = window.ACCOUNT_ANALYSIS || {};
const PF = window.EMBEDDED_PORTFOLIO || {};
const UP = '#cf222e', DOWN = '#1a7f37', BLUE = '#0969da';
const COMBOS = Object.keys(AA);
const urlParams = new URLSearchParams(location.search);
let combo = urlParams.get('combo') || (COMBOS[0] || '');
let mainTab = 'overview';
let page = 1, pageSize = 20;

const fmt = (v, d=0) => v===null||v===undefined||isNaN(v) ? '—' : Number(v).toLocaleString('zh-CN', {maximumFractionDigits:d, minimumFractionDigits:0});
const wan = (v, d=0) => v===null||v===undefined||isNaN(v) ? '—' : (Number(v)/1e4).toLocaleString('zh-CN', {maximumFractionDigits:d});
const pct = v => v===null||v===undefined||isNaN(v) ? '—' : (Number(v)).toFixed(1)+'%';
const pnlCls = v => v>0 ? 'up' : (v<0 ? 'down' : '');
const pnlTxt = v => (v>0?'+':'') + fmt(v);
const esc = s => String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- 组合切换 ----------
function initComboSel(){
  const sel = document.getElementById('comboSel');
  COMBOS.forEach(c=>{
    const o = document.createElement('option');
    o.value = c; o.textContent = (AA[c].name||c);
    sel.appendChild(o);
  });
  sel.value = combo;
  sel.onchange = e=>{ combo = e.target.value; history.replaceState(null,'','?combo='+combo); page=1; render(); };
}

// ---------- 通用 SVG 图表 ----------
function svgLine(dates, values, w=700, h=220, color=BLUE){
  if(!values || values.length<2) return '<div class="empty">暂无数据</div>';
  const n = values.length;
  let min = Math.min(...values), max = Math.max(...values);
  if(max-min < 1e-9){ max += 1; min -= 1; }
  const pad = 10;
  const X = i => pad + i*(w-2*pad)/(n-1);
  const Y = v => h-pad - (v-min)*(h-2*pad)/(max-min);
  let path = '', area = '';
  values.forEach((v,i)=>{ path += (i?'L':'M') + X(i).toFixed(1) + ',' + Y(v).toFixed(1); area += (i?'L':'M') + X(i).toFixed(1) + ',' + Y(v).toFixed(1); });
  area += 'L' + X(n-1).toFixed(1) + ',' + (h-pad) + 'L' + X(0).toFixed(1) + ',' + (h-pad) + 'Z';
  const gid = 'g' + Math.random().toString(36).slice(2,8);
  const last = values[n-1], first = values[0];
  const lastUp = last >= first;
  return `<svg viewBox="0 0 ${w} ${h}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.18"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${[0.25,0.5,0.75].map(f=>`<line x1="${pad}" x2="${w-pad}" y1="${(h-2*pad)*f+pad}" y2="${(h-2*pad)*f+pad}" stroke="#eef1f5"/>`).join('')}
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="1.8"/>
    <circle cx="${X(n-1).toFixed(1)}" cy="${Y(last).toFixed(1)}" r="3.5" fill="${color}"/>
    <text x="${w-pad}" y="${Y(last)-8}" text-anchor="end" font-size="11" fill="${color}" font-weight="600">${fmt(last,2)}</text>
    <text x="${pad}" y="${h-3}" font-size="10" fill="#8b949e">${dates[0]||''}</text>
    <text x="${w-pad}" y="${h-3}" text-anchor="end" font-size="10" fill="#8b949e">${dates[n-1]||''}</text>
  </svg>`;
}
function svgBars(items, w=700, h=240){
  if(!items || !items.length) return '<div class="empty">暂无数据</div>';
  const n = items.length, bw = Math.min(34, (w-40)/n*0.7), gap = Math.min(14, (w-40)/n*0.3);
  let max = Math.max(...items.map(i=>Math.abs(i.v)));
  if(max<=0) max=1;
  let out = '';
  items.forEach((it,i)=>{
    const x = 20 + i*((w-40)/n);
    const bh = Math.abs(it.v)/max * (h-50);
    const y = it.v>=0 ? h-30-bh : h-30;
    out += `<rect x="${x+(gap/2)}" y="${y}" width="${bw}" height="${bh}" fill="${it.v>=0?UP:DOWN}" rx="2" opacity="0.85">
      <title>${it.k}：${fmt(it.v)}</title></rect>`;
  });
  const topN = items.slice(0, Math.min(12, n));
  return `<svg viewBox="0 0 ${w} ${h}">
    <line x1="10" x2="${w-10}" y1="${h-30}" y2="${h-30}" stroke="#d0d7de"/>
    ${out}
    ${topN.map((it,i)=>{ const x=20+i*((w-40)/n)+gap/2; return `<text x="${x+bw/2}" y="${h-12}" text-anchor="middle" font-size="9" fill="#8b949e" transform="rotate(-35 ${x+bw/2} ${h-12})">${it.k}</text>`;}).join('')}
    <text x="${w-10}" y="10" text-anchor="end" font-size="11" fill="#8b949e">单位：元</text>
  </svg>`;
}
function svgHBar(items, w=700, h){
  if(!items || !items.length) return '<div class="empty">暂无数据</div>';
  const n = items.length, rowH = 24;
  h = h || (n*rowH + 30);
  let max = Math.max(...items.map(i=>Math.abs(i.v)));
  if(max<=0) max=1;
  let out = '';
  items.forEach((it,i)=>{
    const y = 14 + i*rowH;
    const bw = Math.abs(it.v)/max * (w-160);
    const x = it.v>=0 ? w/2 : w/2 - bw;
    out += `<rect x="${x}" y="${y+2}" width="${Math.max(bw,2)}" height="16" fill="${it.v>=0?UP:DOWN}" opacity="0.85" rx="2">
      <title>${it.k}：${fmt(it.v)}</title></rect>
      <text x="${w/2-6}" y="${y+14}" text-anchor="end" font-size="11" fill="#57606a">${esc(it.k)}</text>
      <text x="${w/2+8}" y="${y+14}" font-size="11" fill="${it.v>=0?UP:DOWN}" font-weight="600">${pnlTxt(it.v)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}"><line x1="${w/2}" x2="${w/2}" y1="6" y2="${h-8}" stroke="#d0d7de"/>${out}</svg>`;
}

// ---------- 实时数据（本地访问自动拉 18081，线上回退快照） ----------
let LIVE = null;    // {combo: state}
let READY = null;   // 数据就绪
let LIVE_NAV = {};  // {combo: nav曲线}
async function tryLive(){
  try{
    const r = await fetch('http://127.0.0.1:18081/api/state?_='+Date.now(), {cache:'no-store'});
    if(r.ok) LIVE = await r.json();
  }catch(e){ LIVE = null; }
  try{
    const r2 = await fetch('http://127.0.0.1:18081/api/readiness?_='+Date.now(), {cache:'no-store'});
    if(r2.ok) READY = await r2.json();
  }catch(e){}
  try{
    const r3 = await fetch('http://127.0.0.1:18081/api/nav?combo='+combo, {cache:'no-store'});
    if(r3.ok){ const nd = await r3.json(); if(nd && nd.t) LIVE_NAV[combo] = nd; }
  }catch(e){}
  render();
}
function liveSim(D){
  const st = LIVE && LIVE[combo];
  if(!st) return D.sim;
  return {
    account: st.account || D.sim.account,
    positions: st.positions || D.sim.positions,
    trades: st.trades || D.sim.trades,
    close_trades: D.sim.close_trades,
    nav: D.sim.nav,
    settle: D.sim.settle,
    logs: st.logs || [],
    meta: st.meta || {},
    tq_user: st.tq_user,
    name: st.name,
  };
}
function segLabel(){
  const hm = new Date().getHours()*60 + new Date().getMinutes();
  if(hm>=21*60 || hm<9*60) return {t:'夜盘/休市', c:'#185fa5'};
  if(hm>=15*60 && hm<21*60) return {t:'日盘已收盘', c:'#ba7517'};
  return {t:'日盘交易中', c:'#1a7f37'};
}
function readinessHtml(){
  if(!READY) return '<span class="muted-note">数据就绪：今日尚未运行检查（每日 19:30 首查 / 20:15 终查）</span>';
  if(READY.ready===true || READY.missing_count===0)
    return '<span class="ok">✅ 数据全部就绪</span><span class="muted-note">'+esc(READY.total_traders||'')+' 位成员数据已获取 · 20:30 全量核准</span>';
  const names = (READY.missing||[]).slice(0,6).map(x=>esc(x.name||x.aid)).join('、');
  return '<span class="bad">⚠️ '+esc(READY.missing_count)+' 位成员未就绪</span><span class="muted-note">'+(names?names+' · ':'')+'20:30 核准将跳过/沿用旧目标</span>';
}
function switchCombo(c){
  combo = c; page = 1;
  history.replaceState(null,'','?combo='+c);
  render();
}
// ---------- 各 Tab 渲染 ----------
function render(){
  const D = AA[combo]; if(!D){ return; }
  const S = Object.assign({}, D, {sim: liveSim(D)});
  renderInfoBar(S);
  document.querySelectorAll('#mainTabs .tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===mainTab));
  const el = document.getElementById('mainContent');
  if(mainTab==='overview') el.innerHTML = rOverview(S);
  else if(mainTab==='profile') el.innerHTML = rProfile(S);
  else if(mainTab==='profit') el.innerHTML = rProfit(S);
  else if(mainTab==='variety') el.innerHTML = rVariety(S);
  else if(mainTab==='risk') el.innerHTML = rRisk(S);
  else el.innerHTML = rPositions(S);
}
function renderInfoBar(D){
  const acct = D.sim.account||{};
  const b = acct.balance, m = acct.margin;
  const risk = b ? (m/b*100) : null;
  const pf = PF[combo]||{};
  document.getElementById('infoBar').innerHTML = `
    <h1>${esc(D.name)}</h1>
    <span class="tag mode">${D.mode}</span>
    <span class="tag">成员 ${D.members.length} 人</span>
    <span class="tag">年化 ${pct(D.metrics.annual_return)}</span>
    <span class="tag">回撤 ${pct(D.metrics.max_drawdown)}</span>
    <span class="tag up">Calmar ${fmt(D.metrics.return_dd_ratio,2)}</span>
    <div class="right">模拟资金 3000万 · 数据日 ${(D.sim.settle||{}).settle_date||'—'}<br>权益 ${wan(b)}万 · 风险度 ${risk===null?'—':risk.toFixed(1)+'%'}</div>`;
}
function rOverview(D){
  const acct = D.sim.account||{};
  const b = acct.balance, avail = acct.available, m = acct.margin;
  const fp = acct.float_profit||0, risk = b ? (m/b*100) : null;
  const pf = PF[combo]||{};
  const nd = pf.nav_dates||[], nv = pf.nav_values||[];
  const cards = [
    ['动态权益', wan(b)+' 万', ''],
    ['可用资金', wan(avail)+' 万', ''],
    ['占用保证金', wan(m)+' 万', risk!==null ? '风险度 '+risk.toFixed(1)+'%' : ''],
    ['浮动盈亏', pnlTxt(fp), fp!==0 ? '今日持仓盈亏' : ''],
    ['累计净值', fmt(nv[nv.length-1],4)||'—', (pf.metrics||{}).total_return!==undefined ? '累计收益 '+pct((pf.metrics||{}).total_return) : ''],
  ];
  const ma = D.market_adaptation||{};
  const st = D.stress_test||{};
  const perf = [
    ['年化收益率', pct(D.metrics.annual_return)],
    ['最大回撤', pct(D.metrics.max_drawdown)],
    ['收益回撤比', fmt(D.metrics.return_dd_ratio,2)],
    ['夏普比率', fmt(D.metrics.sharpe,2)],
    ['胜率', pct(D.metrics.win_rate)],
    ['年化波动', pct(D.metrics.annual_volatility)],
  ];

function svgSimLine(ts, vals){
  if(!vals || vals.length<2) return '<div class="empty">暂无数据</div>';
  const w=720,h=200,pad=30,n=vals.length;
  let min=Math.min(...vals),max=Math.max(...vals);
  if(max-min<1e-9){max+=1;min-=1;}
  const X=i=>pad+i*(w-2*pad)/(n-1);
  const Y=v=>h-pad-(v-min)*(h-2*pad)/(max-min);
  let path='';
  vals.forEach((v,i)=>{path+=(i?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1);});
  const lastV=vals[n-1], lastT=ts[n-1];
  let tLabel='';
  try{ tLabel = new Date(lastT).toLocaleDateString('zh-CN')+' '+new Date(lastT).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}); }catch(e){}
  return `<svg viewBox="0 0 ${w} ${h}">
    <line x1="${pad}" x2="${w-pad}" y1="${h-pad}" y2="${h-pad}" stroke="#d0d7de"/>
    ${[0.25,0.5,0.75].map(f=>`<line x1="${pad}" x2="${w-pad}" y1="${(h-2*pad)*f+pad}" y2="${(h-2*pad)*f+pad}" stroke="#eef1f5"/>`).join('')}
    <path d="${path}" fill="none" stroke="#0969da" stroke-width="1.8"/>
    <circle cx="${X(n-1).toFixed(1)}" cy="${Y(lastV).toFixed(1)}" r="3.5" fill="#0969da"/>
    <text x="${w-pad}" y="${Y(lastV)-8}" text-anchor="end" font-size="11" fill="#0969da" font-weight="600">${fmt(lastV,0)}</text>
    <text x="${pad}" y="${h-4}" font-size="10" fill="#8b949e">${tLabel}</text>
  </svg>`;
}
function changePage(d){
  page += d; if(page<1) page=1;
  render();
}

// ---------- 事件绑定 ----------
document.getElementById('mainTabs').addEventListener('click', e=>{
  const t = e.target.closest('.tab'); if(!t) return;
  mainTab = t.dataset.tab; page = 1; render();
});
