<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账户分析 · 衡合FOF</title>
<style>
:root{
  --up:#cf222e; --down:#1a7f37; --blue:#0969da; --gold:#ba7517;
  --text:#1f2328; --sub:#57606a; --weak:#8b949e;
  --page:#f6f8fa; --card:#ffffff; --line:#d0d7de; --nav:#1f2a44;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--page);color:var(--text);font-size:14px}
.topnav{background:var(--nav);color:#fff;padding:0 20px;height:52px;display:flex;align-items:center;gap:24px}
.topnav .brand{font-weight:700;font-size:16px;letter-spacing:1px}
.topnav .navlink{color:#c9d4e8;text-decoration:none;font-size:13px;padding:4px 10px;border-radius:6px}
.topnav .navlink.active{background:#2d4a7c;color:#fff}
.topnav .navlink:hover{color:#fff}
.topnav .spacer{flex:1}
.topnav .sel{background:#2d4a7c;color:#fff;border:1px solid #44639a;border-radius:6px;padding:5px 10px;font-size:13px;outline:none}
.wrap{max-width:1280px;margin:0 auto;padding:16px 20px 40px}
.info-bar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.info-bar h1{font-size:20px;font-weight:700}
.info-bar .tag{background:#f0f4fa;border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--sub)}
.info-bar .tag.mode{background:#fff6e5;border-color:#f0c674;color:var(--gold)}
.info-bar .tag.up{background:#fde8e8;border-color:#f3b8b8;color:var(--up)}
.info-bar .right{margin-left:auto;font-size:12px;color:var(--sub);text-align:right}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:8px 18px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--sub);border:none;background:transparent}
.tab:hover{background:#f0f4fa;color:var(--text)}
.tab.active{background:var(--nav);color:#fff;font-weight:600}
.subtabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.subtab{padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--sub);background:var(--card);border:1px solid var(--line)}
.subtab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
/* 持仓分析单页版面（2026-08-27 重做） */
.grid-3{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:1080px){.grid-3{grid-template-columns:1fr}}
.pos-table-wrap,.trade-table-wrap{max-height:380px;overflow-y:auto;border:1px solid #eef1f5;border-radius:8px}
.pos-table-wrap th{position:sticky;top:0;z-index:1}
.chips-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip-btn{padding:6px 14px;background:var(--card);border:1px solid var(--line);border-radius:18px;cursor:pointer;font-size:13px;color:var(--text);transition:all .15s}
.chip-btn:hover{border-color:var(--blue);color:var(--blue)}
.chip-btn.on{background:#fff7e6;border-color:#f0c674;color:#a06000;font-weight:600}
.details-toggle{font-size:12px;color:var(--blue);cursor:pointer;margin-top:8px;user-select:none}
.details-area{margin-top:8px;padding-top:8px;border-top:1px dashed #eaeef2;display:none}
.details-area.open{display:block}
/* 持仓明细表头排序 */
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{background:#eef1f5}
.sort-indicator{font-size:9px;margin-left:3px;opacity:0.3;display:inline-block;width:8px}
.sort-indicator.on{opacity:1;color:var(--blue);font-weight:700}
/* 持仓对齐 Tab（2026-08-27） */
.toggle{position:relative;width:34px;height:18px;background:#d0d7de;border-radius:9px;cursor:pointer;display:inline-block;vertical-align:middle;transition:background .2s}
.toggle.on{background:var(--down)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;background:#fff;border-radius:50%;transition:left .2s}
.toggle.on::after{left:18px}
.align-row:hover td{background:#f0f7ff}
.align-row.align-sel td{background:#e6f1fb}
.legend-chip{font-size:11px;border-radius:10px;padding:1px 8px}
.card .label{font-size:12px;color:var(--weak);margin-bottom:4px}
.card .value{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.card .sub{font-size:11px;color:var(--weak);margin-top:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.panel h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel h3 .hint{font-size:11px;color:var(--weak);font-weight:400}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}
.kv .row{display:flex;justify-content:space-between;border-bottom:1px dashed #eaeef2;padding:5px 0;font-size:13px}
.kv .row .k{color:var(--sub)}
.kv .row .v{font-weight:600;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f6f8fa;color:var(--sub);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid #eef1f5;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tr:hover td{background:#fafbfc}
.up{color:var(--up)} .down{color:var(--down)}
.muted{color:var(--weak)}
.bar-bg{background:#eef1f5;border-radius:4px;height:8px;overflow:hidden;min-width:60px}
.bar-fill{height:100%;border-radius:4px}
.mini-legend{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-top:8px;flex-wrap:wrap}
.member-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.member-card .nm{font-weight:600;font-size:14px}
.member-card .tg{font-size:11px;color:var(--blue);margin-top:3px}
.member-card .kv2{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:6px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:13px;color:var(--sub)}
.pager button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 12px;cursor:pointer}
.pager button:hover{background:#f0f4fa}
.pager button:disabled{opacity:.4;cursor:default}
.filterbar{display:flex;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap;font-size:13px}
.filterbar select,.filterbar input{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px;background:#fff}
.empty{padding:40px;text-align:center;color:var(--weak);font-size:13px}
.feature-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px}
.feature-row .fk{width:70px;color:var(--sub);flex-shrink:0}

.footer{text-align:center;color:var(--weak);font-size:12px;padding:20px 0}
svg{display:block;width:100%;height:auto}
/* 实时监控整合（2026-08-27） */
.ready-bar{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin-bottom:14px;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ready-bar .ok{color:var(--down);font-weight:600}
.ready-bar .bad{color:var(--up);font-weight:600}
.ready-bar .muted-note{color:var(--weak);font-size:12px}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.ov-cell{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.ov-cell:hover{border-color:var(--blue)}
.ov-cell.on{border-color:var(--blue);background:#f0f7ff}
.ov-cell .nm{font-size:13px;font-weight:600;margin-bottom:6px}
.ov-cell .row{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin:3px 0}
.seg-light{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.log-box{background:#1f2a44;color:#c9d4e8;border-radius:10px;padding:10px 12px;font-size:11px;font-family:Consolas,monospace;height:160px;overflow-y:auto;line-height:1.7;margin-top:10px}
.live-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.live-status{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* 原组合↔跟投账户 对比卡（2026-08-27） */
.align-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:900px){.align-cards{grid-template-columns:1fr}}
/* 盘前计划弹窗（2026-08-27） */
.modal-mask{position:fixed;inset:0;background:rgba(31,42,68,0.45);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-mask.open{display:flex}
.modal-box{background:var(--card);border-radius:14px;max-width:940px;width:94vw;max-height:88vh;overflow-y:auto;padding:18px 22px;position:relative}
.modal-box h3{margin-bottom:10px}
.modal-close{position:absolute;top:12px;right:16px;cursor:pointer;font-size:18px;color:var(--weak);background:none;border:none}
.modal-nav{display:flex;align-items:center;gap:12px;margin-bottom:10px}

.danger-strip{background:#fde8e8;color:#cf222e;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:10px;border:0.5px solid #f7c1c1}

.trader-mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;margin-bottom:10px}
.trader-mini .tm{background:#f6f8fa;border:0.5px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;display:flex;align-items:center;gap:6px}
.batch-title{font-size:13px;font-weight:500;margin:10px 0 4px}
.modal-footer{display:flex;gap:10px;margin-top:14px;justify-content:flex-end}
.align-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:all .15s}
.align-card:hover{border-color:var(--blue);box-shadow:0 2px 8px rgba(9,105,218,0.08)}
.align-card .ac-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.align-card .ac-row{display:flex;justify-content:space-between;font-size:12px;line-height:2;border-bottom:1px dashed #eef1f5}
.align-card .ac-row:last-of-type{border-bottom:none}
.ac-arrow{color:var(--weak);margin:0 2px}
.ac-diff{font-size:11px;margin-left:6px}
.ac-prog{display:flex;align-items:center;gap:8px;margin-top:8px}
.ac-prog .lbl{font-size:11px;color:var(--sub);width:56px;flex-shrink:0}
/* 数据日高亮卡 + 就绪详情（2026-08-27） */
.data-day-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:12px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.dd-item{display:flex;flex-direction:column;gap:2px}
.dd-label{font-size:11px;color:var(--weak)}
.dd-value{font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}
.dd-count{font-variant-numeric:tabular-nums}
.dd-progress{flex:1;min-width:150px}
.dd-bar{background:#eef1f5;border-radius:5px;height:9px;overflow:hidden;margin-top:4px}
.dd-fill{height:100%;border-radius:5px;background:var(--blue);transition:width .5s}
.dd-txt{font-size:11px;color:var(--sub);margin-top:3px;display:flex;justify-content:space-between}
.ready-detail{margin-top:8px;padding-top:8px;border-top:1px dashed #eaeef2;display:none;font-size:12px}
.ready-detail.open{display:block}
.rd-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.rd-chip{font-size:11px;border-radius:10px;padding:1px 8px}
.rd-list{max-height:150px;overflow-y:auto;background:#f6f8fa;border:0.5px solid var(--line);border-radius:8px;padding:8px 10px;line-height:1.8;font-size:12px;margin-top:4px}
.rd-tag-ok{color:var(--down)}
.rd-tag-bad{color:var(--up)}
.dual-caliber-bar{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.dual-caliber-bar .cb{flex:1;min-width:240px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;border-left:3px solid var(--blue)}
.dual-caliber-bar .cb.sim{border-left-color:#c9871b}
.dual-caliber-bar .cb b{display:block;font-size:13px;font-weight:600;margin-bottom:3px}
.dual-caliber-bar .cb span{font-size:12px;color:var(--sub)}
.dual .nav{color:var(--blue)} .dual .sim{color:#c9871b}
.dual{display:flex;gap:10px;align-items:baseline;font-size:18px;font-weight:600}
.dual-sub{display:flex;gap:10px;font-size:11px;color:var(--weak);margin-top:2px}
.dual-sub .sim{color:#c9871b}
.warn-tag{display:inline-block;background:#fff4e0;color:#9a6a12;border:1px solid #f0c97a;border-radius:8px;padding:1px 8px;font-size:11px;margin-left:6px}
.legend{font-size:12px;color:var(--sub)} .legend.nav{color:var(--blue)} .legend.sim{color:#c9871b}
.dd-compare{display:flex;flex-direction:column;gap:10px}
.risk-table th:nth-child(2){color:var(--blue)} .risk-table th:nth-child(3){color:#c9871b}
.risk-table td.sim{color:#c9871b}
</style>

<div class="wrap">
  <div class="info-bar" id="infoBar"></div>

    <button class="tab active" data-tab="overview">总览</button>
    <button class="tab" data-tab="profile">账户概况</button>
    <button class="tab" data-tab="profit">盈利分析</button>

<script>
const AA = window.ACCOUNT_ANALYSIS || {};
const PF = window.EMBEDDED_PORTFOLIO || {};
const UP = '#cf222e', DOWN = '#1a7f37', BLUE = '#0969da';
const COMBOS = Object.keys(AA);
const urlParams = new URLSearchParams(location.search);
let combo = urlParams.get('combo') || (COMBOS[0] || '');
let mainTab = 'overview';
let page = 1, pageSize = 20;
let posSort = {col:null, dir:1};  // 持仓明细排序：col=null 不排序，dir=1 降序 -1 升序

const fmt = (v, d=0) => v===null||v===undefined||isNaN(v) ? '—' : Number(v).toLocaleString('zh-CN', {maximumFractionDigits:d, minimumFractionDigits:0});
const wan = (v, d=0) => v===null||v===undefined||isNaN(v) ? '—' : (Number(v)/1e4).toLocaleString('zh-CN', {maximumFractionDigits:d});
const pct = v => v===null||v===undefined||isNaN(v) ? '—' : (Number(v)).toFixed(1)+'%';
const pnlCls = v => v>0 ? 'up' : (v<0 ? 'down' : '');
const pnlTxt = v => (v>0?'+':'') + fmt(v);
const esc = s => String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 把 "2026-08-29 16:04:00" 字符串或 Unix 秒（10位）转 HH:MM；空值返回 '—'
function fmtHHMM(s){
  if(s===null||s===undefined||s==='') return '—';
  if(typeof s==='number'){
    const d = new Date(s>1e12?s:s*1000);
    return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }
  const m = String(s).match(/(\d{2}):(\d{2})/);
  return m ? m[1]+':'+m[2] : '—';
}
// 2026-08-30：取某组合最新一次结算日期（来自 /api/settlement 实时列表，tryLive 已写入 window.__SETL[combo]）
function latestSettleDate(c){
  const list = (window.__SETL && window.__SETL[c]) || [];
  return (list[0] && list[0].settle_date) || null;
}
// 2026-08-30：三页统一数据日标签 = "结算 X · 就绪 Y"（结算=最新结算日，就绪=missed_data 数据日）
function dataDayLabel(c){
  const settle = latestSettleDate(c);
  const ready = (READY && READY.date) || null;
  if(settle && ready && settle !== ready) return `结算 ${esc(settle)} · 就绪 ${esc(ready)}`;
  if(settle) return `结算 ${esc(settle)}`;
  if(ready) return `就绪 ${esc(ready)}`;
  return '—';
}

// ---------- 组合切换 ----------
function initComboSel(){
  const sel = document.getElementById('comboSel');
  COMBOS.forEach(c=>{
    const o = document.createElement('option');
    o.value = c; o.textContent = (AA[c].name||c);
    sel.appendChild(o);
  });
  sel.value = combo;
  sel.onchange = e=>{ combo = e.target.value; history.replaceState(null,'','?combo='+combo); page=1; render(); };
}

// ---------- 通用 SVG 图表 ----------
function svgLine(dates, values, w=700, h=220, color=BLUE){
  if(!values || values.length<2) return '<div class="empty">暂无数据</div>';
  const n = values.length;
  let min = Math.min(...values), max = Math.max(...values);
  if(max-min < 1e-9){ max += 1; min -= 1; }
  const pad = 10;
  const X = i => pad + i*(w-2*pad)/(n-1);
  const Y = v => h-pad - (v-min)*(h-2*pad)/(max-min);
  let path = '', area = '';
  values.forEach((v,i)=>{ path += (i?'L':'M') + X(i).toFixed(1) + ',' + Y(v).toFixed(1); area += (i?'L':'M') + X(i).toFixed(1) + ',' + Y(v).toFixed(1); });
  area += 'L' + X(n-1).toFixed(1) + ',' + (h-pad) + 'L' + X(0).toFixed(1) + ',' + (h-pad) + 'Z';
  const gid = 'g' + Math.random().toString(36).slice(2,8);
  const last = values[n-1], first = values[0];
  const lastUp = last >= first;
  return `<svg viewBox="0 0 ${w} ${h}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.18"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${[0.25,0.5,0.75].map(f=>`<line x1="${pad}" x2="${w-pad}" y1="${(h-2*pad)*f+pad}" y2="${(h-2*pad)*f+pad}" stroke="#eef1f5"/>`).join('')}
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="1.8"/>
    <circle cx="${X(n-1).toFixed(1)}" cy="${Y(last).toFixed(1)}" r="3.5" fill="${color}"/>
    <text x="${w-pad}" y="${Y(last)-8}" text-anchor="end" font-size="11" fill="${color}" font-weight="600">${fmt(last,2)}</text>
    <text x="${pad}" y="${h-3}" font-size="10" fill="#8b949e">${dates[0]||''}</text>
    <text x="${w-pad}" y="${h-3}" text-anchor="end" font-size="10" fill="#8b949e">${dates[n-1]||''}</text>
  </svg>`;
}
function svgBars(items, w=700, h=240){
  if(!items || !items.length) return '<div class="empty">暂无数据</div>';
  const n = items.length, bw = Math.min(34, (w-40)/n*0.7), gap = Math.min(14, (w-40)/n*0.3);
  let max = Math.max(...items.map(i=>Math.abs(i.v)));
  if(max<=0) max=1;
  let out = '';
  items.forEach((it,i)=>{
    const x = 20 + i*((w-40)/n);
    const bh = Math.abs(it.v)/max * (h-50);
    const y = it.v>=0 ? h-30-bh : h-30;
    out += `<rect x="${x+(gap/2)}" y="${y}" width="${bw}" height="${bh}" fill="${it.v>=0?UP:DOWN}" rx="2" opacity="0.85">
      <title>${it.k}：${fmt(it.v)}</title></rect>`;
  });
  const topN = items.slice(0, Math.min(12, n));
  return `<svg viewBox="0 0 ${w} ${h}">
    <line x1="10" x2="${w-10}" y1="${h-30}" y2="${h-30}" stroke="#d0d7de"/>
    ${out}
    ${topN.map((it,i)=>{ const x=20+i*((w-40)/n)+gap/2; return `<text x="${x+bw/2}" y="${h-12}" text-anchor="middle" font-size="9" fill="#8b949e" transform="rotate(-35 ${x+bw/2} ${h-12})">${it.k}</text>`;}).join('')}
    <text x="${w-10}" y="10" text-anchor="end" font-size="11" fill="#8b949e">单位：元</text>
  </svg>`;
}
function svgHBar(items, w=700, h){
  if(!items || !items.length) return '<div class="empty">暂无数据</div>';
  const n = items.length, rowH = 24;
  h = h || (n*rowH + 30);
  let max = Math.max(...items.map(i=>Math.abs(i.v)));
  if(max<=0) max=1;
  let out = '';
  items.forEach((it,i)=>{
    const y = 14 + i*rowH;
    const bw = Math.abs(it.v)/max * (w-160);
    const x = it.v>=0 ? w/2 : w/2 - bw;
    out += `<rect x="${x}" y="${y+2}" width="${Math.max(bw,2)}" height="16" fill="${it.v>=0?UP:DOWN}" opacity="0.85" rx="2">
      <title>${it.k}：${fmt(it.v)}</title></rect>
      <text x="${w/2-6}" y="${y+14}" text-anchor="end" font-size="11" fill="#57606a">${esc(it.k)}</text>
      <text x="${w/2+8}" y="${y+14}" font-size="11" fill="${it.v>=0?UP:DOWN}" font-weight="600">${pnlTxt(it.v)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}"><line x1="${w/2}" x2="${w/2}" y1="6" y2="${h-8}" stroke="#d0d7de"/>${out}</svg>`;
}

async function tryLive(){
  // 2026-08-30：原实现 7 个 fetch 串行 await（行 320-360 顺序）→ 换组合时总耗时 = sum(各 fetch 时间)，很卡。
  // 改为 Promise.allSettled 并行所有 fetch；任意一个失败不影响其他（用 .catch 单独处理）。
  // 末尾统一 render 一次（去掉原 r6 中间 render()）。
  const c = combo;
  const cc = CALIB_COMBO || c;
  const t = todayStr();
  const f = (url) => fetch(url, {cache:'no-store'}).then(r => r.ok ? r.json() : null).catch(() => null);
  const [s, r, n, ac, pl, sl, ad, ds, tf] = await Promise.allSettled([
    f('http://127.0.0.1:18081/api/state?_='+Date.now()),
    f('http://127.0.0.1:18081/api/readiness?_='+Date.now()),
    f('http://127.0.0.1:18081/api/nav?combo='+c),
    f('http://127.0.0.1:18081/api/actions?_='+Date.now()),
    f('http://127.0.0.1:18081/api/poll?_='+Date.now()),
    f('http://127.0.0.1:18081/api/settlement?combo='+c),
    f('http://127.0.0.1:18081/api/align_detail?combo='+cc+(CALIB_DATE?'&date='+CALIB_DATE:'')),
    f('http://127.0.0.1:18081/api/daily_snapshots?date='+t),
    f('http://127.0.0.1:18081/api/today_trades?combo='+c),
  ]);
  if(s.status==='fulfilled' && s.value) LIVE = s.value; else LIVE = null;
  if(r.status==='fulfilled' && r.value) READY = r.value;
  if(n.status==='fulfilled' && n.value && n.value.t) LIVE_NAV[c] = n.value;
  if(ac.status==='fulfilled' && ac.value) ACTIONS = ac.value; else ACTIONS = null;
  if(pl.status==='fulfilled' && pl.value) POLL = pl.value; else POLL = null;
  if(sl.status==='fulfilled' && sl.value && sl.value.settlements){ window.__SETL=window.__SETL||{}; window.__SETL[c]=sl.value.settlements; }
  if(sl.status==='fulfilled' && sl.value && sl.value.sim_metrics){ window.__SIMMETRICS=window.__SIMMETRICS||{}; window.__SIMMETRICS[c]=sl.value.sim_metrics; window.__SIMDD=window.__SIMDD||{}; window.__SIMDD[c]=sl.value.sim_drawdown||[]; window.__SIMDAYS=window.__SIMDAYS||{}; window.__SIMDAYS[c]=sl.value.sim_sample_days; window.__SIMINSUF=window.__SIMINSUF||{}; window.__SIMINSUF[c]=sl.value.sim_insufficient; }
  if(ad.status==='fulfilled' && ad.value && ad.value.combo) CALIB = ad.value; else CALIB = null;
  if(ds.status==='fulfilled' && ds.value && ds.value.date) SNAP = ds.value; else SNAP = null;
  if(tf.status==='fulfilled' && tf.value && tf.value.trades){ TODAY_FILLS[c] = new Set(tf.value.trades.map(x=>x.symbol)); TODAY_TRADES[c] = tf.value.trades; }
  render();
}

  const miss = (READY&&(READY.missing_count!==undefined?READY.missing_count:(READY.missing||[]).length))||0;

    ${fbTip}
  </div>`;
}
// 倒计时秒级更新（只改 dd-count 元素，不整页 render）
function updateCountdown(){
  const el = document.getElementById('dd-count');
  if(!el || mainTab!=='align') return;
  const now = new Date();
  const mk = (h,m)=>{ const t=new Date(); t.setHours(h,m,0,0); return t; };
  let next=null, label='';
  const done = !!(POLL&&POLL.done);
  if(now < mk(19,30)){ next=mk(19,30); label='19:30 轮询开始'; }
  else if(now < mk(20,30)){
    if(done){ next=mk(20,30); label='已全部取到 · 20:30 核准'; }
    else{
      // 距下一 15 分钟轮询点
      const base = mk(19,30);
      const mins = Math.floor((now - base)/60000);
      const nextMins = (Math.floor(mins/15)+1)*15;
      next = new Date(base.getTime() + nextMins*60000);
      label = '下次轮询（每 15 分钟）';
    }
  }
  else if(now < mk(21,0)){ next=mk(21,0); label='20:30 已核准 · 21:00 开盘执行'; }
  else {
    // 21:00 夜盘后：取数轮询继续（直到 done） + 夜盘执行
    if(done){ next=mk(9,0); next.setDate(next.getDate()+1); label='夜盘执行中 · 已全部取到 · 次日 09:00 撮合'; }
    else {
      const base = mk(19,30);
      const mins = Math.floor((now - base)/60000);
      const nextMins = (Math.floor(mins/15)+1)*15;
      next = new Date(base.getTime() + nextMins*60000);
      label = '继续轮询（每 15 分钟）· 夜盘执行中';
    }
  }
  const s = Math.max(0, Math.floor((next-now)/1000));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), ss = s%60;
  const pad = n=>String(n).padStart(2,'0');
  el.textContent = label+' · '+h+'h '+pad(m)+'m '+pad(ss)+'s';
}

// 原组合 ↔ 跟投账户 对比数据（真实计算）
function comboAlign(c){
  const d = AA[c]||{};
  const st = (LIVE && LIVE[c]) || null;
  // 跟投端（模拟账户实际持仓）
  const positions = (st && st.positions) ? st.positions : ((d.sim&&d.sim.positions)||[]);
  const fSet = new Set(); let fLots=0, fMargin=0;
  positions.forEach(p=>{
    const s=(p.symbol||'').split('.').pop()||''; const m=s.match(/^[A-Za-z]+/);
    if(m) fSet.add(m[0].toUpperCase());
    fLots += Math.abs(p.long||0)+Math.abs(p.short||0);
    fMargin += p.margin||0;
  });
  const fBal = (st&&st.account&&st.account.balance)||(d.sim&&d.sim.account&&d.sim.account.balance)||0;
  // 原组合端（盘手汇总持仓 + 盘手权益）
  const cp = (window.EMBEDDED_COMBO_POSITIONS||{})[c]||[];
  const oSet = new Set(); let oLots=0, oMargin=0;
  cp.forEach(r=>{ if(r.variety) oSet.add(String(r.variety).toUpperCase()); oLots += Math.abs(r.net||0); oMargin += r.margin||0; });
  const oEquity = (d.members||[]).reduce((s,m)=>s+(m.equity_wan||0),0)*1e4;
  // 跟投比例 scale = 3000万 / 原资金（无资金兜底按保证金）
  let scale = 0;
  if(oEquity>0) scale = 30000000/oEquity;
  else if(oMargin>0) scale = 30000000/oMargin;
  // 理论跟投手数/保证金 = 原值×scale；对齐度 = 实际/理论
  const tLots = Math.round(oLots*scale), tMargin = oMargin*scale;
  const alignPct = tLots>0 ? fLots/tLots*100 : (tMargin>0?fMargin/tMargin*100:0);
  return {oVar:oSet.size, fVar:fSet.size, oLots, fLots, tLots, oMargin, fMargin, tMargin, oEquity, fBal, scale, alignPct};
}
function rAlignCards(){

        <span class="ac-diff" style="color:var(--sub)">理论 ${fmt(a.tLots)}</span>
        ${lotOk?'<span class="ac-diff" style="color:var(--down)">✓</span>':'<span class="ac-diff" style="color:#ba7517">差 '+(lotDiff>0?'+':'')+fmt(lotDiff)+'</span>'}</span></div>
      <div class="ac-row"><span style="color:var(--sub)">资金</span>
        <span>原 <b>${fmtAmt(a.oMargin)}</b><span class="ac-arrow">↔</span><b style="color:var(--blue)">跟 ${fmtWan(a.fMargin)}</b>

function phaseOf(){

function fmtCd(h,m){

    <div class="dd-item"><span class="dd-label">📋 计划生成</span><span class="dd-value sm">${esc((ts.plan_built_at||'—').slice(11,19))}</span></div>
    <div class="dd-item"><span class="dd-label">🆗 校准</span><span class="dd-value sm">${calT}</span></div>
    <div class="dd-item"><span class="dd-label">🕒 最新</span><span class="dd-value sm">${esc((ts.last_updated_at||'—').slice(11,19))}</span></div>
    <div class="dd-item"><span class="dd-label">📅 历史记录</span><span class="dd-value sm"><input type="date" value="${esc(CALIB_DATE)}" onchange="setCalibDate(this.value)" style="padding:3px 6px;font-size:12px;border:0.5px solid var(--line);border-radius:6px"></span></div>
    <div class="dd-item" style="margin-left:auto"><button style="border:0.5px solid var(--blue);background:var(--blue);color:#fff;border-radius:8px;padding:6px 16px;font-size:13px;cursor:pointer;${CALIB_DATE?'opacity:.5;cursor:not-allowed':''}" ${CALIB_DATE?'disabled':''} onclick="doCalibrate('${c}')">立即校准</button></div>
  </div>
  <div class="panel" style="margin-bottom:12px">
    <h3>① 盘手原持仓 <span class="hint">${fs.ready_count||0}/${fs.total_count||0} 已取数 · 品种行 × 盘手列 · 末列原汇总</span></h3>
    <div class="trade-table-wrap" style="max-height:320px"><table>
      <tr><th style="text-align:left">品种</th>${traderAids.map(aid=>`<th style="text-align:center">${esc(rawByTrader[aid].name.split('的')[0]||rawByTrader[aid].name)}<br><span style="font-weight:400;color:var(--weak)">#${esc(aid)}</span></th>`).join('')}<th style="text-align:center">原汇总</th></tr>
      ${rawRowHtml}
    </table></div>
    <div class="mini-legend"><span>多/空 为各盘手 T 日原始持仓；原汇总 = 各盘手同品种求和（按净手数降序）</span></div>
  </div>
  <div class="panel" style="margin-bottom:12px">
    <h3>② 净持仓 vs 跟投账户（数据校准） <span class="hint">差异阈值 ±1 手 或 5%</span></h3>
    <div class="trade-table-wrap" style="max-height:300px"><table>
      <tr><th style="text-align:left">品种</th><th style="text-align:center">原多/空</th><th style="text-align:center">原净</th><th style="text-align:center">缩放目标</th><th style="text-align:center">跟投实际</th><th style="text-align:center">差异</th><th style="text-align:center">状态</th></tr>
      ${nvfRows}
    </table></div>
    <div class="mini-legend">
      <span><span class="legend-chip" style="background:#e6f4ea;color:#1a7f37">已对齐</span> 差异=0</span>
      <span><span class="legend-chip" style="background:#faebcc;color:#a06000">误差内</span> ≤1手或5%</span>
      <span><span class="legend-chip" style="background:#fde8e8;color:#cf222e">需核准</span> 超阈值</span>
    </div>
  </div>
  <div class="panel">
    <h3>③ 动作计划 <span class="hint">共 ${acts.length} 笔 · 21:00 夜盘 / 次日 09:00 撮合 · ${CALIB_DATE?'历史快照':'今日已成交 '+(TODAY_FILLS[c]?TODAY_FILLS[c].size:0)+' 个品种'}</span></h3>
    <div class="trade-table-wrap" style="max-height:300px"><table>
      <tr><th style="text-align:left">品种</th><th style="text-align:center">方向</th><th style="text-align:center">开平</th><th style="text-align:right">手数</th><th style="text-align:right">当前→目标</th><th style="text-align:center">批次</th><th style="text-align:center">状态</th></tr>
      ${actRows}
    </table></div>
    <div class="mini-legend"><span>校准 = 比对原汇总 → 净持仓 → 缩放目标 → 跟投实际 全链路，确认无误差后点「立即校准」写校准时间</span></div>
  </div>`;
}
function setCalibDate(v){
  CALIB_DATE = v || '';
  tryLive();
}
function doCalibrate(c){
  fetch('http://127.0.0.1:18081/api/align_calibrate?combo='+c+'&date='+todayStr(), {method:'POST', cache:'no-store'})
    .then(r=>r.json())
    .then(j=>{ if(j&&j.ok){ alert('校准完成 '+j.calibrate_at); tryLive(); } else { alert('校准失败：'+(j&&j.error||'未知')); } })
    .catch(e=>alert('校准请求失败：'+e.message));
}
// ---------- 日记录 Tab（2026-08-29 v2：盘前计划+开盘执行每日快照回溯） ----------
let SNAP_DATE = todayStr();
async function loadSnap(){
  try{
    const r = await fetch('http://127.0.0.1:18081/api/daily_snapshots?date='+SNAP_DATE, {cache:'no-store'});
    if(r.ok){ SNAP = await r.json(); render(); }
  }catch(e){}
}
function rDailyRecord(){
  const snap = (SNAP && SNAP.date===SNAP_DATE) ? SNAP : {date:SNAP_DATE, pre_market:{}, execution:{records:[]}};
  const pm = snap.pre_market || {};
  const ex = snap.execution || {records:[]};
  const summary = pm.summary || {};
  const metrics = pm.combo_metrics || [];
  const records = ex.records || [];
  // ① 盘前计划 4 卡片
  const cards = [
    ['待执行组合', `${summary.todo||0} / 10`, '有差异待补单'],
    ['总动作', `${summary.acts||0} 笔`, '多单/空单净变化合计'],
    ['预计占用', `¥${((summary.est||0)/1e4).toFixed(0)}万`, '数据齐全组合合计'],
    ['计划生成', `<span style="font-size:14px">${esc(String(summary.plan_built_at||'—').slice(11,16)||'—')}</span>`, `更新于 ${esc(String(snap.updated_at||'—').slice(11,19))}`],
  ];
  // ① 盘前计划 表格（按 combo_metrics，与 rPrePlan 同构：方案D 多单/空单变化）
  const rows = metrics.map(p=>{
    const ts = p.trader_status||{got:0,total:0};
    const ready = !!p.data_ready;
    const isNet = p.combo_type!=='single';
    let stChip;
    if(!p.combo_type) stChip = '<span class="legend-chip" style="background:#f0f4fa;color:#57606a">快照</span>';
    else if(isNet) stChip = ready
      ? `<span class="legend-chip" style="background:#e6f4ea;color:#1a7f37">✅ ${ts.got}/${ts.total} 已取</span>`
      : `<span class="legend-chip" style="background:#fde8e8;color:#cf222e">⚠️ ${ts.got}/${ts.total} 已取</span>`;
    else stChip = `<span class="legend-chip" style="background:#f0f4fa;color:#57606a">盘手 ${ts.got>0?'✓':'✗'}</span>`;
    const typeChip = isNet
      ? '<span class="legend-chip" style="background:#e6f1fb;color:#185fa5">净持仓</span>'
      : '<span class="legend-chip" style="background:#faeeda;color:#854f0b">单盘手</span>';
    const a2 = p.actions || [];
    let buyOpen=0, sellClose=0, sellOpen=0, buyClose=0;
    a2.forEach(a=>{
      const v = a.volume||0, dir = a.direction, off = a.offset;
      if(dir==='BUY' && off==='OPEN') buyOpen += v;
      else if(dir==='SELL' && off==='CLOSE') sellClose += v;
      else if(dir==='SELL' && off==='OPEN') sellOpen += v;
      else if(dir==='BUY' && off==='CLOSE') buyClose += v;
    });
    const chgCell = (part, chg, upPart, dnPart) => {
      if(!part) return '<td style="text-align:right" class="muted">—</td>';
      const cls = chg>0 ? 'up' : (chg<0 ? 'down' : '');
      const sign = chg>0 ? '+' : (chg<0 ? '-' : '');
      const dist = (upPart||dnPart) ? `<span class="muted" style="font-size:11px"> 加${upPart||0}·减${dnPart||0}</span>` : '';
      return `<td style="text-align:right" class="${cls}">${sign}${fmt(Math.abs(chg))} 手${dist}</td>`;
    };
    const estHtml = (p.combo_type && !ready) ? '<span class="muted">¥—</span>' : `<span class="muted">¥${((p.est_margin||0)/1e4).toFixed(0)}万</span>`;
    return `<tr>
      <td>${esc((p.name||p.combo).replace('组合','').replace('全能主','').replace('优质',''))}</td>
      <td>${typeChip}</td>
      <td>${stChip}</td>
      ${chgCell(buyOpen||sellClose, buyOpen-sellClose, buyOpen, sellClose)}
      ${chgCell(sellOpen||buyClose, sellOpen-buyClose, sellOpen, buyClose)}
      <td style="text-align:right">${fmt(p.total_vol||0)}</td>
      <td style="text-align:right">${estHtml}</td>
    </tr>`;
  }).join('');
  // ② 开盘执行：从 snapshot 的 execution.records 统计（动作状态用当前 LIVE 内存态查）
  let doneCnt=0, pendCnt=0, failCnt=0, totalExec=0;
  const allActions = pm.all_actions || [];
  allActions.forEach(a=>{
    totalExec++;
    const st = actionStatus(a.combo||combo, a);
    if(st.t==='✓ 成交') doneCnt++; else if(st.t==='⏳ 挂单') pendCnt++; else if(st.t==='✗ 未成交') failCnt++;
  });
  const rate = totalExec ? (doneCnt/totalExec*100).toFixed(1)+'%' : '—';
  const execRows = records.length
    ? records.slice().reverse().map(x=>`<tr><td>${esc(x.at||'—')}</td><td style="text-align:left">${esc((AA[x.combo]||{}).name||x.combo)}</td><td style="text-align:right">${fmt(x.actions)} 笔</td><td style="text-align:center">${esc(x.group||'all')}</td></tr>`).join('')
    : '<tr><td colspan="4" class="empty">当日尚未核准（数据齐后 19:30 起自动核准归档）</td></tr>';
  const isToday = snap.date === todayStr();
  return `
  <div class="panel">
    <h3>日记录 <span class="hint">持仓对齐页 ① 盘前计划 + ② 开盘执行 · 每日归档 · 点历史日期可调出</span></h3>
    <div class="filterbar">
      <span class="label" style="font-weight:500">日期：</span>
      <input type="date" value="${esc(SNAP_DATE)}" onchange="setSnapDate(this.value)" style="padding:5px 8px">
      <span class="muted">数据日 ${esc(snap.date||SNAP_DATE)} · ${isToday?'今天':'历史快照'}</span>
      <span style="flex:1"></span>
      <span class="muted">更新于 ${esc(String(snap.updated_at||'—').slice(11,19))}</span>
    </div>
    ${snap.note ? `<div class="empty" style="padding:24px">${esc(snap.note)}</div>` : `
    <div class="panel" style="margin-bottom:12px">
      <h3>① 盘前计划 <span class="hint">来源：${esc(snap.date)} 自动化归档</span></h3>
      <div class="cards" style="grid-template-columns:repeat(4,1fr);margin-bottom:10px">
        ${cards.map(c=>`<div class="card"><div class="label">${c[0]}</div><div class="value">${c[1]}</div><div class="sub">${c[2]}</div></div>`).join('')}
      </div>
      <div class="trade-table-wrap" style="max-height:380px"><table>
        <tr><th style="text-align:left">组合</th><th>类型</th><th>数据状态</th><th style="text-align:right">多单变化</th><th style="text-align:right">空单变化</th><th style="text-align:right">预计手数</th><th style="text-align:right">预计保证金</th></tr>
        ${rows||'<tr><td colspan="7" class="empty">该日无盘前计划数据</td></tr>'}
      </table></div>
    </div>
    <div class="panel">
      <h3>② 开盘执行 <span class="hint">来源：${esc(snap.date)} 核准时自动写入 · 只读</span></h3>
      <div class="cards" style="grid-template-columns:repeat(4,1fr);margin-bottom:10px">
        <div class="card"><div class="label">已成交</div><div class="value" style="color:var(--down)">${doneCnt}${totalExec?' / '+totalExec:''}</div><div class="sub">${isToday?'实时':'历史'}</div></div>
        <div class="card"><div class="label">挂单中</div><div class="value" style="color:#a06000">${pendCnt}</div><div class="sub">等待成交</div></div>
        <div class="card"><div class="label">未成交</div><div class="value" style="color:var(--up)">${failCnt}</div><div class="sub">失败/无行情</div></div>
        <div class="card"><div class="label">成交率</div><div class="value">${rate}</div><div class="sub">${isToday?'实时':'历史'}</div></div>
      </div>
      <table>
        <tr><th>核准时间</th><th style="text-align:left">组合</th><th style="text-align:right">动作数</th><th style="text-align:center">分组</th></tr>
        ${execRows}
      </table>
    </div>
    `}
  </div>`;
}
function setSnapDate(d){ SNAP_DATE = d; loadSnap(); }
function setAlignFilter(f){ alignFilter=f; render(); }
function setAlignAuto(){ alignAuto=!alignAuto; render(); }
// 持仓对齐页自动刷新（仅该 Tab 激活时，读 /api/state 内存态；60s 刷新，与页面"自动刷新 60s"一致）
setInterval(()=>{ if(alignAuto && (mainTab==='align'||mainTab==='calibrate')) tryLive(); }, 60000);
function svgSimLine(ts, vals){
  if(!vals || vals.length<2) return '<div class="empty">暂无数据</div>';
  const w=720,h=200,pad=30,n=vals.length;
  let min=Math.min(...vals),max=Math.max(...vals);
  if(max-min<1e-9){max+=1;min-=1;}
  const X=i=>pad+i*(w-2*pad)/(n-1);
  const Y=v=>h-pad-(v-min)*(h-2*pad)/(max-min);
  let path='';
  vals.forEach((v,i)=>{path+=(i?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1);});
  const lastV=vals[n-1], lastT=ts[n-1];
  let tLabel='';
  try{ tLabel = new Date(lastT).toLocaleDateString('zh-CN')+' '+new Date(lastT).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}); }catch(e){}
  return `<svg viewBox="0 0 ${w} ${h}">
    <line x1="${pad}" x2="${w-pad}" y1="${h-pad}" y2="${h-pad}" stroke="#d0d7de"/>
    ${[0.25,0.5,0.75].map(f=>`<line x1="${pad}" x2="${w-pad}" y1="${(h-2*pad)*f+pad}" y2="${(h-2*pad)*f+pad}" stroke="#eef1f5"/>`).join('')}
    <path d="${path}" fill="none" stroke="#0969da" stroke-width="1.8"/>
    <circle cx="${X(n-1).toFixed(1)}" cy="${Y(lastV).toFixed(1)}" r="3.5" fill="#0969da"/>
    <text x="${w-pad}" y="${Y(lastV)-8}" text-anchor="end" font-size="11" fill="#0969da" font-weight="600">${fmt(lastV,0)}</text>
    <text x="${pad}" y="${h-4}" font-size="10" fill="#8b949e">${tLabel}</text>
  </svg>`;
}
function changePage(d){
  page += d; if(page<1) page=1;
  render();
}

// ---------- 事件绑定 ----------
let _lastTabRefresh = 0;
document.getElementById('mainTabs').addEventListener('click', e=>{
  const t = e.target.closest('.tab'); if(!t) return;
  mainTab = t.dataset.tab; page = 1;
  render();
  // 2026-08-30：切 tab 立即刷新（避免显示 60s 前的旧数据）；防抖 1s 内不重复拉
  const now = Date.now();
  if(now - _lastTabRefresh > 1000){ _lastTabRefresh = now; tryLive(); }
});
initComboSel();
render();
tryLive();  // 尝试拉取 18081 实时数据（失败自动回退快照）
</script>
<div class="modal-mask" id="alignModal" onclick="if(event.target===this)closeAlignModal()">
  <div class="modal-box" id="alignModalBox"></div>
</div>
